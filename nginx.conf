# =============================================================================
# mcp-server-chart Nginx 反向代理配置
# 用法：在主 nginx.conf 的 http 块中 include 此文件
#   include /path/to/nginx.conf;
# 或放在 /etc/nginx/conf.d/ 下由主配置自动加载
# =============================================================================

# ── upstream 定义 ──────────────────────────────────────────────────────────
# 注意：如果 nginx 和 docker 容器在同一台宿主机上，用 127.0.0.1 + 映射端口
#       如果 nginx 也在 docker 网络中，用容器名:端口（如 mcp-server-chart-1:1122）
upstream mcp_streamable {
    # MCP Streamable HTTP 传输
    server 127.0.0.1:1122;
    keepalive 32;
}

# upstream mcp_sse {
#     # MCP SSE 传输
#     server 127.0.0.1:1123;
#     keepalive 32;
# }

# ── Server 块 ──────────────────────────────────────────────────────────────
server {
    listen 80;
    # 替换为你的域名
    server_name mcp-chart.example.com;

    # 如果只在内网使用，用 IP 或 _ 通配
    # server_name _;

    # 客户端请求体大小限制
    client_max_body_size 10m;

    # ── 访问日志（可选，按需开启） ──────────────────────────────────────────
    access_log /var/log/nginx/mcp-chart-access.log;
    error_log  /var/log/nginx/mcp-chart-error.log warn;

    # ═══════════════════════════════════════════════════════════════════════
    # MCP Streamable 传输
    # ═══════════════════════════════════════════════════════════════════════
    location / {
        proxy_pass http://mcp_streamable/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── 关键：Streamable HTTP 传输需要禁用缓冲 ──
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 长连接超时（MCP 会话可能持续较长时间）
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
    }

    # ═══════════════════════════════════════════════════════════════════════
    # MCP SSE 传输（如需启用，取消下面注释）
    # ═══════════════════════════════════════════════════════════════════════
    # location /mcp/sse/ {
    #     proxy_pass http://mcp_sse/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Connection "";
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #
    #     proxy_buffering off;
    #     proxy_cache off;
    #     proxy_set_header X-Accel-Buffering no;
    #
    #     proxy_read_timeout 3600s;
    #     proxy_send_timeout 60s;
    # }

    # ═══════════════════════════════════════════════════════════════════════
    # 健康检查
    # ═══════════════════════════════════════════════════════════════════════
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}

